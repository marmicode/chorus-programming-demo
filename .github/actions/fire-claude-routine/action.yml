name: Fire Claude Code routine
description: POST a JSON dispatcher payload to the Kitchen Claude Code routine API trigger

inputs:
  skill:
    description: Skill name (or job id under .claude/routines/jobs/) to invoke. Set exactly one of skill or workflow.
    required: false
    default: ''
  workflow:
    description: Workflow name under .claude/workflows/ to run. Set exactly one of skill or workflow.
    required: false
    default: ''
  args:
    description: JSON object of arguments for the skill or workflow
    required: false
    default: '{}'
  message:
    description: Run-specific context (URLs, SHAs, notes)
    required: true
  branch:
    description: Branch to pass to the routine (defaults to the triggering ref)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Fire routine
      shell: bash
      env:
        ROUTINE_FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_01EdyDYbfD3ToeEFNfeanWdJ/fire
        REPOSITORY: ${{ github.repository }}
        SKILL: ${{ inputs.skill }}
        WORKFLOW: ${{ inputs.workflow }}
        ARGS: ${{ inputs.args }}
        MESSAGE: ${{ inputs.message }}
        BRANCH_INPUT: ${{ inputs.branch }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        if [ -z "${CLAUDE_CODE_ROUTINE_FIRE_TOKEN:-}" ]; then
          echo "Missing repository secret CLAUDE_CODE_ROUTINE_FIRE_TOKEN"
          exit 1
        fi

        if { [ -n "$SKILL" ] && [ -n "$WORKFLOW" ]; } || { [ -z "$SKILL" ] && [ -z "$WORKFLOW" ]; }; then
          echo "Set exactly one of the skill and workflow inputs"
          exit 1
        fi

        if [ -n "$BRANCH_INPUT" ]; then
          BRANCH="$BRANCH_INPUT"
        elif [ -n "$HEAD_REF" ]; then
          BRANCH="$HEAD_REF"
        else
          BRANCH="$REF_NAME"
        fi

        TEXT="$(jq -nc \
          --arg repository "$REPOSITORY" \
          --arg branch "$BRANCH" \
          --arg skill "$SKILL" \
          --arg workflow "$WORKFLOW" \
          --argjson args "$ARGS" \
          --arg message "$MESSAGE" \
          '{repository: $repository, branch: $branch}
            + (if $skill != "" then {skill: $skill} else {workflow: $workflow} end)
            + {args: $args, message: $message}')"

        BODY="$(jq -nc --arg text "$TEXT" '{text: $text}')"

        HTTP_CODE="$(curl -sS -o /tmp/routine-fire-response.json -w '%{http_code}' \
          -X POST "$ROUTINE_FIRE_URL" \
          -H "Authorization: Bearer ${CLAUDE_CODE_ROUTINE_FIRE_TOKEN}" \
          -H "anthropic-version: 2023-06-01" \
          -H "Content-Type: application/json" \
          -d "$BODY")"

        cat /tmp/routine-fire-response.json
        echo ""

        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          echo "Routine fire failed with HTTP $HTTP_CODE"
          exit 1
        fi
