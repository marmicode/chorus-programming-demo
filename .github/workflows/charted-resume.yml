name: Charted resume

# When a commit lands on a waypoint branch and the waypoint is not done yet, fire the routine
# that resumes the charted-autopilot workflow on it. Commits pushed by the charted loop itself
# (dispatch, autopilot, self-heal) carry a "Charted-Loop:" trailer and are ignored.

on:
  push:
    branches: ['**-waypoint-*']

permissions:
  contents: read

concurrency:
  group: charted-resume-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.event.head_commit != null && !contains(github.event.head_commit.message, 'Charted-Loop:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Check waypoint progress
        id: status
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STATUS="$(node tools/charted/charted-resume.mjs --branch "$BRANCH")"
          echo "$STATUS"
          echo "resume=$(jq -r '.matched and (.done | not)' <<< "$STATUS")" >> "$GITHUB_OUTPUT"
          echo "args=$(jq -c '{designDocPath, waypoint}' <<< "$STATUS")" >> "$GITHUB_OUTPUT"
          echo "waypoint=$(jq -r '.waypoint // empty' <<< "$STATUS")" >> "$GITHUB_OUTPUT"
          echo "designDocPath=$(jq -r '.designDocPath // empty' <<< "$STATUS")" >> "$GITHUB_OUTPUT"

      - name: Fire charted-autopilot routine
        if: steps.status.outputs.resume == 'true'
        uses: ./.github/actions/fire-claude-routine
        env:
          CLAUDE_CODE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_CODE_ROUTINE_FIRE_TOKEN }}
        with:
          # The charted-autopilot workflow is more robust; charted-autopilot-light is a skill — faster, better for the demo.
          skill: charted-autopilot-light
          branch: ${{ github.ref_name }}
          args: ${{ steps.status.outputs.args }}
          message: >-
            A commit landed on this branch: resume waypoint #${{ steps.status.outputs.waypoint }}
            of ${{ steps.status.outputs.designDocPath }}.
            Commit: ${{ github.event.head_commit.url }}
